<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery Test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="./galleryTest.css">
</head>
<body>
  <div id="image-track" data-mouse-down-at="0" data-prev-percentage="0">
    <img class="image" src="../imagens/Galeria/Barragem1.jpeg" draggable="false" alt="Passeio junto à água ao pôr do sol">
    <img class="image" src="../imagens/Galeria/Barragem2.jpeg" draggable="false" alt="Vista da barragem e do percurso equestre">
    <img class="image" src="../imagens/Galeria/Barragem4.jpeg" draggable="false" alt="Cavalos em passeio junto ao Alqueva">
    <img class="image" src="../imagens/Galeria/barragem5.jpeg" draggable="false" alt="Momento de passeio equestre ao ar livre">
    <img class="image" src="../imagens/Galeria/Desporto1.jpg" draggable="false" alt="Atividade equestre em movimento">
    <img class="image" src="../imagens/Galeria/Desporto2.JPG" draggable="false" alt="Cena de desporto equestre">
    <img class="image" src="../imagens/Galeria/desporto3.JPG" draggable="false" alt="Passeio equestre em ação">
    <img class="image" src="../imagens/Galeria/desporto4.JPG" draggable="false" alt="Momento de atividade equestre">
    <img class="image" src="../imagens/Galeria/passeio1.jpeg" draggable="false" alt="Passeio a cavalo em paisagem aberta">
    <img class="image" src="../imagens/Galeria/passeio2.jpeg" draggable="false" alt="Cavalos em percurso tranquilo">
    <img class="image" src="../imagens/Galeria/passeio4.JPG" draggable="false" alt="Passeio equestre ao ar livre">
    <img class="image" src="../imagens/Galeria/Piquenique.jpeg" draggable="false" alt="Momento de piquenique junto aos cavalos">
    <img class="image" src="../imagens/Galeria/piquenique2.jpg" draggable="false" alt="Piquenique em ambiente natural">
  </div>

  <script src="./galleryTest.js"></script>
</body>
</html>
